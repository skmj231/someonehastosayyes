# fly launch --no-deploy 후 이 파일 사용. 볼륨: fly volumes create data --size 1
app = "someonehastosayyes"
primary_region = "nrt"
[build]
[env]
  PORT = "3000"
  DB_PATH = "/data/approvals.db"
[mounts]
  source = "data"
  destination = "/data"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1
